name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to build and what is missing or hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could ivf2 support this? An API sketch is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
