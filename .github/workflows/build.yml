# Continuous integration: build and test ivf2 on Windows, Linux and macOS.
#
# To keep CI cheap, not every event builds every platform (the "plan" job decides):
#
#   push to main ............ quick: Linux (GCC) only, unit tests, no visual tests
#   pull request ............ full matrix
#   nightly (schedule) ...... full matrix, only if main got new commits in the last 24 hours
#   "Run workflow" button ... full matrix
#   release.yml (version tag) full matrix; the release is created only if it passes
#
# The full matrix also builds the examples for the browser and smoke tests them in headless
# Chrome (web.yml, job "Web"); docs.yml does the same before publishing them.
#
# A commit message containing [skip ci] skips the build altogether.

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']   # documentation-only changes don't need a rebuild
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '17 2 * * *'   # nightly, 02:17 UTC
  workflow_dispatch:
  workflow_call:           # used by release.yml

# A newer push to the same branch cancels a still-running older build.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository.
permissions:
  contents: read

defaults:
  run:
    shell: bash   # use bash on all three OSes (Git Bash on Windows) so steps are identical

jobs:
  # Decides which platforms to build for this event (see the table at the top).
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select platforms
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # All platforms. Fields are used as matrix.<name> by the build job.
          cat > matrix.json <<'JSON'
          [
            { "name": "Windows (MSVC)", "os": "windows-2025", "cache-id": "windows-2025",
              "vcpkg-installed": "vcpkg_installed", "configure-preset": "vs",
              "build-preset": "vs-release", "build-dir": "build/vs" },
            { "name": "Linux (GCC)", "os": "ubuntu-24.04", "cache-id": "ubuntu-24.04",
              "vcpkg-installed": "vcpkg_installed", "configure-preset": "release",
              "build-preset": "release", "build-dir": "build/release",
              "ccache": true, "visual-tests": true },
            { "name": "macOS (AppleClang)", "os": "macos-15", "cache-id": "macos-15",
              "vcpkg-installed": "vcpkg_installed", "configure-preset": "release",
              "build-preset": "release", "build-dir": "build/release",
              "ccache": true },
            { "name": "Linux (minimal)", "os": "ubuntu-24.04", "cache-id": "ubuntu-24.04-minimal",
              "vcpkg-installed": "build/minimal/vcpkg_installed", "configure-preset": "minimal",
              "build-preset": "minimal", "build-dir": "build/minimal",
              "ccache": true }
          ]
          JSON
          # "Linux (minimal)" keeps the fallback code paths (all optional dependencies off) compiling.
          # Visual tests render the examples with Mesa llvmpipe under Xvfb.

          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "Push to main: quick build (Linux GCC only, no visual tests)"
            matrix=$(jq -c '[.[] | select(.name == "Linux (GCC)") | .["visual-tests"] = false]' matrix.json)
            web=false
          elif [ "$EVENT" = "schedule" ] && \
               [ "$(git log -1 --format=%ct)" -lt "$(( $(date +%s) - 86400 ))" ]; then
            echo "Nightly: no new commits in the last 24 hours, nothing to build"
            matrix='[]'
            web=false
          else
            echo "$EVENT ($REF): full matrix"
            matrix=$(jq -c '.' matrix.json)
            web=true
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # The examples in the browser (Emscripten, WebGL 2), with the full matrix only
  web:
    name: Web
    needs: plan
    if: needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      # The library and examples use precompiled headers; this lets ccache cache their users.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    strategy:
      fail-fast: false   # let the other platforms finish even if one fails
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # 1. Get the ivf2 source code onto the runner.
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Operating-system packages that vcpkg expects from the system
      #    (X11/Wayland and OpenGL headers for GLFW, ALSA for RtMidi).
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf automake libtool \
            libgl1-mesa-dev libglu1-mesa-dev libopengl-dev \
            xorg-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libasound2-dev
          # Visual regression tests: virtual X server and Mesa's software OpenGL (llvmpipe)
          if [ "${{ matrix.visual-tests }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-utils gdb
          fi

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf automake libtool || true

      # 3. Get vcpkg at exactly the commit named by "builtin-baseline" in vcpkg.json,
      #    so CI builds the same dependency versions as a developer machine.
      - name: Set up vcpkg
        run: |
          # Normalise Windows paths (D:\a\_temp -> D:/a/_temp) so CMake gets forward slashes.
          tmp="$RUNNER_TEMP"; ws="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = "Windows" ]; then tmp=$(cygpath -m "$tmp"); ws=$(cygpath -m "$ws"); fi

          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          echo "vcpkg baseline: $baseline"
          git clone --quiet https://github.com/microsoft/vcpkg.git "$tmp/vcpkg"
          git -C "$tmp/vcpkg" checkout --quiet "$baseline"
          cd "$tmp/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then ./bootstrap-vcpkg.bat -disableMetrics; else ./bootstrap-vcpkg.sh -disableMetrics; fi
          mkdir -p "$tmp/vcpkg-cache"

          # Variables written to $GITHUB_ENV are visible to all later steps.
          echo "TMP_DIR=$tmp" >> "$GITHUB_ENV"
          echo "WORKSPACE_DIR=$ws" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$tmp/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$tmp/vcpkg-cache" >> "$GITHUB_ENV"

      # 4. Restore previously built dependency packages. The key changes whenever
      #    the dependency list changes; restore-keys allows reusing an older cache
      #    so only the changed packages are rebuilt.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.cache-id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**') }}
          restore-keys: vcpkg-${{ matrix.cache-id }}-

      # 4b. Compiler cache (Linux/macOS): only sources that changed since the cached
      #     build are recompiled. Pull requests read the cache but don't save their own,
      #     to stay within the repository's cache storage. Not used with MSVC (the Visual
      #     Studio generator doesn't support compiler launchers).
      - name: Set up ccache
        if: matrix.ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.cache-id }}
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      # 5. Configure. vcpkg installs the dependencies during this step.
      #    Warnings in ivf2's own code fail the build, so they get fixed when they appear.
      - name: Configure
        run: |
          launcher=""
          if [ "${{ matrix.ccache }}" = "true" ]; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake --preset ${{ matrix.configure-preset }} -DIVF2_WARNINGS_AS_ERRORS=ON \
            -DIVF2_VISUAL_TESTS=${{ matrix.visual-tests && 'ON' || 'OFF' }} $launcher

      # 6. Save the dependency cache right away, so it survives even if the
      #    build or tests below fail.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # 7. Build libraries, examples and tests.
      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

      # 8. Run the unit tests with CTest.
      - name: Test
        run: ctest --preset ${{ matrix.build-preset }} -LE visual

      # 8b. Visual regression tests: render the examples hidden on a virtual X server with
      #     Mesa's software renderer and compare them with tests/visual/reference/.
      #     The rendered images and diffs are uploaded as the "visual-tests" artifact; to
      #     accept intended changes, copy the rendered images into tests/visual/reference/.
      - name: Visual tests
        if: matrix.visual-tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" glxinfo -B | grep -E "OpenGL (renderer|core profile version)"
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --preset ${{ matrix.build-preset }} -L visual -j 2

      - name: Upload visual test images
        if: always() && matrix.visual-tests
        uses: actions/upload-artifact@v7
        with:
          name: visual-tests
          path: ${{ matrix.build-dir }}/visual/
          if-no-files-found: ignore
          retention-days: 14

      # 9. Install ivf2 and build a separate project against the installed package.
      - name: Install
        run: cmake --install ${{ matrix.build-dir }} --config Release --prefix "$TMP_DIR/ivf2-install"

      - name: Package consumer test
        run: |
          cmake -S tests/package -B "$TMP_DIR/package-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$TMP_DIR/ivf2-install" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$WORKSPACE_DIR/${{ matrix.vcpkg-installed }}"
          cmake --build "$TMP_DIR/package-build" --config Release --parallel

      # On failure, keep vcpkg's build logs so dependency build errors can be inspected
      # (download them from the run's summary page).
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.cache-id }}
          path: |
            ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7
