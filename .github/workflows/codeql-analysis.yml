# CodeQL: GitHub's static analysis for security problems and common bugs.
# Results appear under the repository's "Security" -> "Code scanning" tab.
#
# build-mode: none analyses the C++ sources without compiling them, so this
# workflow needs no compiler, vcpkg or dependencies.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 23 * * 5'   # weekly, Friday 23:29 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write   # needed to upload results

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none
          # Don't report on bundled third-party code.
          config: |
            paths-ignore:
              - include/glm
              - include/glad
              - include/KHR
              - include/dirent
              - src/glad
              - examples/assimp1/ImGuiFileDialog.cpp
              - examples/assimp1/ImGuiFileDialog.h

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
