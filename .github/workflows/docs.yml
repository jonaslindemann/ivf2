name: Deploy Docs to GitHub Pages

# Rebuilds the site only when something it is generated from changes (the user guide, the
# sources Doxygen reads - see INPUT in Doxyfile - or what the web examples are built from).
# The examples compiled for the browser (web.yml) are published under web/; the site is
# deployed only if they build and pass their smoke test, so the live links never break.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'include/ivf/**'
      - 'include/ivfui/**'
      - 'include/ivfmusic/**'
      - 'include/ivfvis/**'
      - 'include/ivfmath/**'
      - 'src/ivf/**'
      - 'src/ivfui/**'
      - 'src/ivfmusic/**'
      - 'src/ivfvis/**'
      - 'src/ivfmath/**'
      - 'examples/**'
      - 'data/**'
      - 'cmake/**'
      - 'tests/web/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    name: Web examples
    uses: ./.github/workflows/web.yml

  build:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y doxygen graphviz

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate Doxygen API docs
        run: doxygen Doxyfile

      - name: Build Zensical site
        run: python -m zensical build --clean --config-file docs/zensical.toml

      - name: Add the web examples
        uses: actions/download-artifact@v8
        with:
          name: web-examples
          path: docs/site/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
