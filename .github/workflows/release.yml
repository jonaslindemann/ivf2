# Release: runs when a version tag (v2.0.0, v2.0.0-alpha.2, ...) is pushed.
#
# 1. check:   the tag must match the version in CMakeLists.txt and CHANGELOG.md must have a
#             section for it (fails fast, before the expensive build).
# 2. build:   the full Build workflow (all platforms, visual tests, package test).
# 3. release: creates a GitHub release whose notes are the tag's section of CHANGELOG.md.
#
# Releases are published as normal releases (also alpha/beta versions) and become the latest
# release. See CONTRIBUTING.md.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version
        id: version
        run: |
          base=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          pre=$(sed -nE 's/^set\(IVF2_VERSION_PRERELEASE "([^"]*)"\).*/\1/p' CMakeLists.txt | head -1)
          version="$base${pre:+-$pre}"
          tag="${GITHUB_REF_NAME#v}"
          echo "CMakeLists.txt: $version, tag: $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          # Lines between "## [<version>]" and the next "## [" heading
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          cat notes.md

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: Create release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.version }}"
          # Same extraction as in the check job, which verified that the section exists.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "ivf2 $version" --notes-file notes.md --verify-tag --latest
