[project]
site_name = "Interactive Visual Framework 2"
site_description = "Documentation for the Ivf2 C++ graphics library"
site_author = "Jonas Lindemann"
site_url = "https://interactive-visualisation-framework-2.readthedocs.io/"
repo_url = "https://github.com/jonaslindemann/ivf2"
repo_name = "GitHub"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting_started/installation.md" },
    { "Basic Concepts" = "getting_started/basic_concepts.md" },
    { "Your first Application" = "getting_started/your_first_app.md" },
  ] },
  { "Core" = [
    { "Nodes" = "core/nodes.md" },
    { "Materials and Textures" = "core/materials_and_textures.md" },
    { "Shader Materials" = "core/shader_materials.md" },
    { "PBR and Image-Based Lighting" = "core/pbr_and_ibl.md" },
    { "Lighting" = "core/lighting.md" },
    { "Deformers" = "core/deformers.md" },
    { "Procedural Geometry" = "core/procedural_geometry.md" },
    { "Time Control" = "core/time_controller.md" },
  ] },
  { "Primitives" = [
    { "Basic Primitives" = "primitives/basic_primitives.md" },
    { "Complex Primitives" = "primitives/complex_primitives.md" },
    { "Text" = "primitives/text.md" },
  ] },
  { "Animation" = [
    { "Choosing an Animation Tool" = "animation/choosing.md" },
    { "Basic Animation" = "animation/basic_animation.md" },
    { "Keyframe Animation" = "animation/keyframe_animation.md" },
    { "Spline Animation" = "animation/spline_animation.md" },
    { "Lissajous" = "animation/lissajous.md" },
    { "Camera Animation" = "animation/camera_animation.md" },
  ] },
  { "Effects" = [
    { "Overview" = "effects/index.md" },
    { "HDR and Tone Mapping" = "effects/hdr.md" },
    { "Blur, Bloom and Depth" = "effects/blur.md" },
    { "Ambient Occlusion and Reflections" = "effects/screen_space.md" },
{ "Colour Effects" = "effects/color_effects.md" },
    { "Film and Distortion" = "effects/film_effects.md" },
    { "Custom Effects" = "effects/custom_effects.md" },
  ] },
  { "Advanced" = [
    { "Shadows" = "advanced/shadows.md" },
    { "Selection" = "advanced/selection.md" },
    { "Model Loading" = "advanced/model_loading.md" },
    { "Hot Reload" = "advanced/hot_reload.md" },
{ "Visitors" = "advanced/visitor_pattern.md" },
    { "Render Context" = "advanced/render_context.md" },
    { "Render Queue" = "advanced/render_queue.md" },
    { "Diagnostics" = "advanced/diagnostics.md" },
    { "Error Handling" = "advanced/error_handling.md" },
  ] },
  { "Visualisation" = [
    { "Overview" = "visualisation/index.md" },
    { "Colormaps and Colour Bars" = "visualisation/colormaps.md" },
    { "Point Clouds" = "visualisation/point_clouds.md" },
    { "Isosurfaces and Slices" = "visualisation/scalar_fields.md" },
    { "Glyphs and Streamlines" = "visualisation/vector_fields.md" },
    { "Volume Rendering" = "visualisation/volumes.md" },
    { "Axes and Labels" = "visualisation/axes.md" },
    { "Reading Data Files" = "visualisation/readers.md" },
    { "2D Plots" = "visualisation/plots.md" },
] },
  { "Creative Programming" = [
    { "Overview" = "creative/index.md" },
    { "Flow Fields" = "creative/flow_field.md" },
    { "Time-Driven Animation" = "creative/time_and_animation.md" },
    { "Music-Driven Scenes" = "creative/music_scenes.md" },
  ] },
  { "UI" = [
    { "UI Windows" = "ui/ui_windows.md" },
    { "Scene Window" = "ui/scene_window.md" },
    { "Built-in Scene Tools" = "ui/scene_ui_integration.md" },
    { "Ready-made Widgets" = "ui/widgets.md" },
    { "Custom UI" = "ui/custom_ui.md" },
    { "Time Control Panel" = "ui/time_control_panel.md" },
  ] },
  { "Examples" = [
    { "Example Index" = "examples/index.md" },
    { "Example Gallery" = "examples/gallery.md" },
{ "Primitive Examples" = "examples/primitives_examples.md" },
    { "Texture Examples" = "examples/texture_examples.md" },
    { "Animation Examples" = "examples/animation_examples.md" },
    { "Asset Examples" = "examples/asset_examples.md" },
    { "Deformer Examples" = "examples/deformer_examples.md" },
    { "Lighting Examples" = "examples/lighting_examples.md" },
    { "Interaction Examples" = "examples/interaction_examples.md" },
    { "Effects Examples" = "examples/effects_examples.md" },
    { "UI Examples" = "examples/ui_examples.md" },
    { "Time Control Examples" = "examples/time_control_examples.md" },
    { "Flow Field Examples" = "examples/flow_field_examples.md" },
    { "Camera Animation Examples" = "examples/camera_anim_examples.md" },
    { "Music Scene Examples" = "examples/music_examples.md" },
  ] },
  { "Reference" = [
    { "Cheat Sheet" = "reference/cheat_sheet.md" },
    { "API Reference" = "api/index.md" },
  ] },
]

[project.theme]
font = { text = "Geist", code = "Geist Mono" }
features = [
  "navigation.tabs",
  "navigation.expand",
  "navigation.instant",
  "navigation.tracking",
  "content.code.copy",
  "content.code.annotate",
]

[[project.theme.palette]]
scheme = "slate"
accent = "yellow"
primary = "yellow"

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
[project.markdown_extensions.pymdownx.arithmatex]
[project.markdown_extensions.pymdownx.snippets]
# Resolved against the build directory: "." when building from the repo root (Read the Docs),
# ".." when building from docs/. Missing files fail the build instead of being skipped.
base_path = [".", ".."]
check_paths = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
